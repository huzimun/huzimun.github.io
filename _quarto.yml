project:
  type: website
  output-dir: _site
  render:
    - index.qmd

website:
  title: "Mingwang Hu · 胡明望"
  description: "Mingwang Hu is a Ph.D. student at Tianjin University, working on AI security, multimodal LLMs, and visual generative models."
  site-url: https://huzimun.github.io
  search: false

format:
  html:
    theme: none
    minimal: true
    css: assets/css/academic.css
    toc: false
    link-external-newwindow: true
    include-in-header:
      - text: |
          <meta name="theme-color" content="#f8f9f6">
          <link rel="icon" type="image/png" href="assets/img/avatar.png">
          <meta property="og:title" content="Mingwang Hu · Academic Homepage">
          <meta property="og:description" content="Ph.D. student at Tianjin University working on AI security, multimodal LLMs, and visual generative models.">
          <meta property="og:type" content="website">
          <meta property="og:image" content="https://huzimun.github.io/assets/img/avatar.png">
    include-after-body:
      - file: page.html
      - text: |
          <script src="assets/js/academic.js" defer></script>
