project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - publications.qmd
    - cv.qmd

website:
  title: "Mingwang Hu"
  description: "Personal Academic Homepage"
  site-url: https://huzimun.github.io
  repo-url: https://github.com/huzimun/huzimun.github.io
  repo-actions: [edit, issue]

  navbar:
    title: "Mingwang Hu"
    left:
      - href: index.qmd
        text: Home
      - href: publications.qmd
        text: Publications
      - href: cv.qmd
        text: CV
    right:
      - icon: google
        href: https://scholar.google.com/citations?user=XiVJkjMAAAAJ&hl=zh-CN
        aria-label: Google Scholar
      - icon: github
        href: https://github.com/huzimun
        aria-label: GitHub
      - icon: envelope
        href: mailto:humingwang@tju.edu.cn
        aria-label: Email

  page-footer:
    left: "© 2026 Mingwang Hu. All rights reserved."
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme: cosmo
    css: assets/css/styles.css
    math: mathjax
    toc: true
    toc-depth: 3
    link-external-newwindow: true
    highlight-style: github

bibliography: refs.bib
